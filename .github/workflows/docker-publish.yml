name: Build & Publish Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Override version tag (e.g. 1.2.0) — leave blank to auto-bump"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-bump patch version
        id: auto
        if: inputs.build_number == ''
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Use manual version
        id: manual
        if: inputs.build_number != ''
        run: |
          TAG="v${{ inputs.build_number }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "new_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set output tag
        id: tag
        run: |
          if [[ -n "${{ inputs.build_number }}" ]]; then
            echo "new_tag=v${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${{ steps.auto.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          fi

  build-api:
    name: Build & push API image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cyberlaboratory/llmwiki-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build & push Web image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cyberlaboratory/llmwiki-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
