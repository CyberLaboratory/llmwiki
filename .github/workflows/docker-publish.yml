name: Build & Publish Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Override version tag (e.g. 1.2.0) — leave blank to auto-bump"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-bump patch version
        id: auto
        if: inputs.build_number == ''
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          initial_version: 1.0.3

      - name: Use manual version
        id: manual
        if: inputs.build_number != ''
        run: |
          TAG="v${{ inputs.build_number }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ inputs.build_number }}" ]]; then
            echo "new_tag=v${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${{ steps.auto.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true

  build-api:
    name: Build & push API image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cyberlaboratory/llmwiki-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build & push Web image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cyberlaboratory/llmwiki-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_MCP_URL=${{ secrets.NEXT_PUBLIC_MCP_URL }}
            NEXT_PUBLIC_OPENREPLAY_KEY=${{ secrets.NEXT_PUBLIC_OPENREPLAY_KEY }}

  update-k8s-deployment:
    name: Update K8s Deployment
    runs-on: ubuntu-latest
    needs: [version, build-api, build-web]
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (needs.build-api.result == 'success') &&
      (needs.build-web.result == 'success') &&
      (github.ref == 'refs/heads/master')
    permissions:
      contents: read
    env:
      DEPLOY_VERSION: ${{ needs.version.outputs.tag }}
      GITOPS_REPO: ${{ vars.GITOPS_REPO || 'CyberLaboratory/k8' }}
      GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH || 'main' }}
      GITOPS_LLMWIKI_PATH: ${{ vars.GITOPS_LLMWIKI_PATH || 'clusters/on-prem/apps/llmwiki' }}

    steps:
      - name: Validate GitOps configuration
        env:
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
            echo "Missing secret GITOPS_PUSH_TOKEN."
            exit 1
          fi

          echo "TARGET_PATH=${GITOPS_LLMWIKI_PATH}" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=${GITOPS_BRANCH}" >> "$GITHUB_ENV"

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          ref: ${{ env.GITOPS_BRANCH }}
          path: gitops
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update deployment manifests
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          target_dir = Path('gitops') / os.environ["TARGET_PATH"]
          version = os.environ["DEPLOY_VERSION"]

          # web.yaml contains the web deployment, api.yaml contains the api deployment
          manifests = {
              target_dir / "web.yaml": "ghcr.io/cyberlaboratory/llmwiki-web",
              target_dir / "api.yaml": "ghcr.io/cyberlaboratory/llmwiki-api",
          }

          image_pattern = re.compile(
              r'(?m)^(\s*image:\s*){image}(?::[^\s]*)?\s*$'
          )

          if not target_dir.exists():
              raise SystemExit(f"Target path does not exist: {target_dir}")

          for manifest_path, image_base in manifests.items():
              if not manifest_path.exists():
                  raise SystemExit(f"Manifest does not exist: {manifest_path}")

              image_ref = f"{image_base}:{version}"
              pattern = re.compile(
                  rf'(?m)^(\s*image:\s*){re.escape(image_base)}(?::[^\s]*)?\s*$'
              )
              content = manifest_path.read_text(encoding="utf-8")
              updated, n = pattern.subn(rf'\g<1>{image_ref}', content)
              if n == 0:
                  raise SystemExit(
                      f"Did not find image reference for {image_base} in {manifest_path}"
                  )
              if updated != content:
                  manifest_path.write_text(updated, encoding="utf-8")
                  print(f"Updated {manifest_path.name}: {image_ref}")
          PY

      - name: Commit and push GitOps update
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_BRANCH="$(git -C gitops branch --show-current)"
          if [ -z "$CURRENT_BRANCH" ]; then
            echo "Unable to determine the checked out GitOps branch."
            exit 1
          fi

          if git -C gitops diff --quiet; then
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                printf '%s\n' '### Kubernetes Deployment'
                printf '\n'
                printf '%s\n' "GitOps manifests already reference \`${DEPLOY_VERSION}\`."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gitops add -A -- "$TARGET_PATH"
          git -C gitops commit \
            -m "chore(llmwiki): deploy ${DEPLOY_VERSION}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git -C gitops push origin HEAD:"$TARGET_BRANCH"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              printf '%s\n' '### Kubernetes Deployment Updated'
              printf '\n'
              printf '%s\n' "**Repo**: \`${GITOPS_REPO}\`"
              printf '%s\n' "**Branch**: \`${CURRENT_BRANCH}\`"
              printf '%s\n' "**Path**: \`${TARGET_PATH}\`"
              printf '%s\n' "**Version**: \`${DEPLOY_VERSION}\`"
              printf '%s\n' "**Web image**: \`ghcr.io/cyberlaboratory/llmwiki-web:${DEPLOY_VERSION}\`"
              printf '%s\n' "**API image**: \`ghcr.io/cyberlaboratory/llmwiki-api:${DEPLOY_VERSION}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
