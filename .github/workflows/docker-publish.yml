name: Build & Publish Docker Images

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: "Override version tag (e.g. 1.2.0) — leave blank to auto-bump"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-bump patch version
        id: auto
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && inputs.build_number == ''
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          initial_version: 1.0.3

      - name: Use manual version
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.build_number != ''
        run: |
          TAG="v${{ inputs.build_number }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "new_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.build_number }}" ]]; then
            echo "new_tag=v${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${{ steps.auto.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true

  build-api:
    name: Build & push API image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cyberlaboratory/llmwiki-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build & push Web image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cyberlaboratory/llmwiki-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_MCP_URL=${{ secrets.NEXT_PUBLIC_MCP_URL }}
            NEXT_PUBLIC_OPENREPLAY_KEY=${{ secrets.NEXT_PUBLIC_OPENREPLAY_KEY }}

  build-mcp:
    name: Build & push MCP image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cyberlaboratory/llmwiki-mcp
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy:
    name: Update k8 deployment manifests
    runs-on: ubuntu-latest
    needs: [version, build-api, build-web, build-mcp]
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write

    steps:
      - name: Checkout k8 repository
        uses: actions/checkout@v4
        with:
          repository: CyberLaboratory/k8
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          ref: main

      - name: Update image tags
        run: |
          VERSION="${{ needs.version.outputs.tag }}"
          echo "Updating to version: $VERSION"
          
          # Update API image
          sed -i "s|ghcr.io/cyberlaboratory/llmwiki-api:v[0-9.]*|ghcr.io/cyberlaboratory/llmwiki-api:$VERSION|g" \
            clusters/on-prem/apps/llmwiki/api.yaml
          
          # Update MCP image
          sed -i "s|ghcr.io/cyberlaboratory/llmwiki-mcp:v[0-9.]*|ghcr.io/cyberlaboratory/llmwiki-mcp:$VERSION|g" \
            clusters/on-prem/apps/llmwiki/mcp.yaml
          
          # Update Web image
          sed -i "s|ghcr.io/cyberlaboratory/llmwiki-web:v[0-9.]*|ghcr.io/cyberlaboratory/llmwiki-web:$VERSION|g" \
            clusters/on-prem/apps/llmwiki/web.yaml

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          VERSION="${{ needs.version.outputs.tag }}"
          git add clusters/on-prem/apps/llmwiki/*.yaml
          git commit -m "chore: update llmwiki images to $VERSION" || echo "No changes to commit"
          git push origin main
